openapi: 3.0.3
info:
  title: Sintech Backend API
  version: 1.0.0
servers:
  - url: /api/v1
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "429":
          description: Rate limited
  /metrics:
    get:
      summary: Runtime metrics snapshot
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: OK
  /verticals:
    get:
      summary: List verticals
      responses:
        "200":
          description: OK
  /verticals/{id}:
    get:
      summary: Get one vertical
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not found
  /verticals/{id}/home:
    get:
      summary: Get home section
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not found
    patch:
      summary: Patch home section
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
        "400":
          description: Invalid payload
        "401":
          description: Unauthorized
  /verticals/{id}/industry:
    get:
      summary: Get industry section
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /verticals/{id}/consumer:
    get:
      summary: Get consumer section
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
