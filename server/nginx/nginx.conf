events {}

http {
  upstream sintech_backend {
    least_conn;
    server api1:4000;
    server api2:4000;
  }

  server {
    listen 8080;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://sintech_backend;
    }
  }
}
