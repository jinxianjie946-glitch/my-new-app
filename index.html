<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sintech — Smart Hardware Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>

  <!-- ===== Top Nav ===== -->
  <nav class="site-nav" role="navigation" aria-label="Main Navigation">
    <div class="gi-nav-inner">
      <div class="gi-nav-brand">
        <div class="gi-nav-logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="sintech_titanium" x1="20" y1="70" x2="80" y2="30" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#A69781"/>
                <stop offset="50%" stop-color="#E0D6C3"/>
                <stop offset="100%" stop-color="#D0C0A5"/>
              </linearGradient>
            </defs>
            <path d="M12 68C12 68 28 66 40 58C52 50 48 34 60 34C72 34 72 58 88 62"
              stroke="url(#sintech_titanium)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="gi-brand-name">Sintech</span>
      </div>
      <div class="tab-list" role="tablist">
        <button id="tab-insights" class="tab-btn active" data-tab="global-insights" role="tab" aria-selected="true" aria-controls="global-insights">Industry Insights</button>
        <button id="tab-consumer" class="tab-btn" data-tab="consumer-profile" role="tab" aria-selected="false" aria-controls="consumer-profile">Consumer Insights</button>
        <button id="tab-dashboard" class="tab-btn" data-tab="trends" role="tab" aria-selected="false" aria-controls="trends">Dashboard</button>
      </div>
      <div class="lang-toggle" aria-label="Language Selector">
        <button class="lang-btn active" data-lang="en" aria-label="Switch to English" aria-pressed="true">EN</button>
        <span class="lang-sep" aria-hidden="true">/</span>
        <button class="lang-btn" data-lang="cn" aria-label="切换至中文" aria-pressed="false">CN</button>
      </div>
    </div>
  </nav>

  <main>
    <!-- ===== Tab: Global Insights (Home -> Industry Insights) ===== -->
    <section id="global-insights" class="tab-panel active" role="tabpanel" aria-labelledby="tab-insights">
      <div class="gi-layout">
        <!-- Sidebar -->
        <aside class="gi-sidebar" aria-label="Verticals Selection"></aside>

        <!-- Main Content: Executive Summary & Intelligence Matrix -->
        <div class="gi-main" id="matrix-main">
          
          <!-- Level 1: Executive Summary -->
          <div class="exec-summary">
            <div class="gi-header" style="margin-bottom: 16px;">
              <div>
                <h2 class="gi-title"></h2>
                <p class="gi-subtitle"></p>
              </div>
              <span class="gi-badge">Updated: 2025 Q3</span>
            </div>
            
            <div class="exec-takeaway-card">
              <div class="exec-takeaway-label" data-i18n="execTakeawayLabel">Key Takeaway</div>
              <div class="exec-takeaway-text" id="exec-takeaway-text">--</div>
            </div>

            <div class="gi-kpi-grid" id="vital-metrics-grid">
              <!-- Rendered via JS -->
            </div>
          </div>

          <!-- Level 2: Intelligence Matrix -->
          <div class="intel-matrix">
            <div class="matrix-tabs" role="tablist">
              <button class="matrix-tab-btn active" data-matrix="macro" role="tab">Macro & Market</button>
              <button class="matrix-tab-btn" data-matrix="competition" role="tab">Competitive Landscape</button>
              <button class="matrix-tab-btn" data-matrix="demand" role="tab">Demand Trends</button>
            </div>
            <div class="matrix-content" id="matrix-content">
              <!-- Rendered via JS -->
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- Deep Dive Drawer -->
    <div id="deep-dive-drawer" class="drawer-overlay" aria-hidden="true">
      <div class="drawer-content">
        <div class="drawer-header">
          <h3 id="drawer-title">Deep Dive</h3>
          <button id="drawer-close" class="drawer-close-btn" aria-label="Close">&times;</button>
        </div>
        <div class="drawer-body module-workspace" id="drawer-body">
          <!-- Rendered via JS (m01-m10) -->
        </div>
      </div>
    </div>

    <!-- ===== Tab: Consumer Insights ===== -->
    <section id="consumer-profile" class="tab-panel" role="tabpanel" aria-labelledby="tab-consumer">
      <div class="gi-layout">
        <aside class="gi-sidebar" aria-label="Verticals Selection"></aside>
        <div class="gi-main empty-state">
          <!-- Emptied as per user request -->
        </div>
      </div>
    </section>

    <!-- ===== Tab: Dashboard ===== -->
    <section id="trends" class="tab-panel" role="tabpanel" aria-labelledby="tab-dashboard">
      <div class="gi-layout">
        <aside class="gi-sidebar" aria-label="Verticals Selection"></aside>
        <div class="gi-main empty-state">
          <!-- Emptied as per user request -->
        </div>
      </div>
    </section>
  </main>

  <div id="loading-overlay" class="loading-overlay" aria-label="Loading" role="status">
    <div class="loading-spinner"></div>
  </div>
  <div id="toast" role="alert" aria-live="polite" style="opacity:0; visibility:hidden"></div>
  <script defer src="i18n.js?v=10"></script>
  <script defer src="analysisModules.js?v=10"></script>
  <script defer src="app.js?v=10"></script>
</body>
</html>
