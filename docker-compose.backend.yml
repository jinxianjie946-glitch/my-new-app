services:
  api1:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_PATH=/app/data/app.db
      - API_KEY=${API_KEY:?API_KEY required}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
      - METRICS_RATE_LIMIT_PER_MIN=${METRICS_RATE_LIMIT_PER_MIN:-60}
    expose:
      - "4000"

  api2:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_PATH=/app/data/app.db
      - API_KEY=${API_KEY:?API_KEY required}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
      - METRICS_RATE_LIMIT_PER_MIN=${METRICS_RATE_LIMIT_PER_MIN:-60}
    expose:
      - "4000"

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./server/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - api1
      - api2
